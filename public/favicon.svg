<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Seal Gradient -->
    <radialGradient id="sealGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#A5233B" />
      <stop offset="60%" stop-color="#80162A" />
      <stop offset="100%" stop-color="#4E0B19" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF2D0" />
      <stop offset="25%" stop-color="#ECC675" />
      <stop offset="50%" stop-color="#C59145" />
      <stop offset="75%" stop-color="#E8BE68" />
      <stop offset="100%" stop-color="#9A6B25" />
    </linearGradient>

    <!-- Inner Shadow / Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Wax Seal Outer Base -->
  <circle cx="64" cy="64" r="60" fill="url(#sealGrad)" stroke="url(#goldMetallic)" stroke-width="3" />
  
  <!-- Decorative Beaded Gold Inner Ring -->
  <circle cx="64" cy="64" r="53" fill="none" stroke="url(#goldMetallic)" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.85" />
  <circle cx="64" cy="64" r="49" fill="none" stroke="url(#goldMetallic)" stroke-width="0.8" opacity="0.6" />

  <!-- Auspicious Kalasam & Coconut Motif -->
  <g filter="url(#goldGlow)" fill="url(#goldMetallic)">
    <!-- Kalasam Pot Base -->
    <path d="M52 94 C52 96, 76 96, 76 94 L73 90 L55 90 Z" />
    <!-- Kalasam Pot Body -->
    <path d="M47 88 C40 76, 44 65, 52 61 L76 61 C84 65, 88 76, 81 88 C76 92, 52 92, 47 88 Z" />
    <!-- Pot Neck & Rim -->
    <rect x="53" y="58" width="22" height="3" rx="1.5" />
    <!-- Mango Leaves -->
    <path d="M64 58 C58 50, 44 48, 43 45 C48 45, 59 51, 62 57 Z" />
    <path d="M64 58 C70 50, 84 48, 85 45 C80 45, 69 51, 66 57 Z" />
    <path d="M64 58 C62 48, 54 40, 52 36 C57 38, 63 47, 64 57 Z" />
    <path d="M64 58 C66 48, 74 40, 76 36 C71 38, 65 47, 64 57 Z" />
    <!-- Coconut Center Top -->
    <path d="M64 36 C58 42, 57 52, 60 58 L68 58 C71 52, 70 42, 64 36 Z" />
    <!-- Auspicious Swastika / Lotus Accent on Pot -->
    <circle cx="64" cy="74" r="3.5" fill="#FDF2D0" />
    <path d="M64 68 L64 80 M58 74 L70 74" stroke="#A5233B" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Monogram S & N at Bottom Arc -->
  <text x="64" y="112" font-family="'Cinzel', serif, system-ui" font-size="10" font-weight="700" fill="url(#goldMetallic)" text-anchor="middle" letter-spacing="3">S &amp; N</text>
</svg>
